[workspace]
resolver = "2"
members = ["crates/*", "apps/*", "xtask"]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT OR Apache-2.0"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
dbg_macro = "warn"
todo = "warn"

[workspace.dependencies]
octocrab-core = { path = "crates/core" }
octocrab = "0.54"
tokio = { version = "1", features = ["full"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rusqlite = { version = "0.32", features = ["bundled"] }
aes-gcm = "0.10"
rand = "0.8"
clap = { version = "4", features = ["derive"] }
anyhow = "1"
chrono = { version = "0.4", features = ["serde"] }
dirs = "5"
base64 = "0.22"
http = "1"
http-body-util = "0.1"
bytes = "1"
# egui stack pinned together
egui = "0.29"
eframe = { version = "0.29", default-features = false, features = ["glow", "default_fonts", "x11"] }
egui_extras = { version = "0.29", default-features = false }
poll-promise = "0.3"

[profile.dev.package."*"]
opt-level = 2

[profile.dev]
opt-level = 1
debug = 0

[profile.release]
lto = "thin"
codegen-units = 1
