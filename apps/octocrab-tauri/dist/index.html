<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self' 'unsafe-inline'; script-src 'self' 'unsafe-inline'; img-src 'self' data:" />
  <title>Octocrab Control Center</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <header id="topbar">
    <div class="brand">
      <span class="brand-mark">🐙</span>
      <span class="brand-name">Octocrab <b>Control Center</b></span>
    </div>
    <div class="target-box">
      <label for="target-input">target</label>
      <input id="target-input" type="text" spellcheck="false" placeholder="owner/repo" />
      <button id="target-set" class="btn ghost" title="Set target repository">Set</button>
    </div>
    <div class="spacer"></div>
    <button id="refresh-btn" class="btn ghost" title="Reload current section">⟳ Refresh</button>
  </header>

  <div id="shell">
    <nav id="sidenav">
      <div class="nav-item active" data-section="overview">⌂ <span>Overview</span></div>
      <div class="nav-item" data-section="workflows">⚙ <span>Workflows</span></div>
      <div class="nav-item" data-section="runs">▶ <span>Runs</span></div>
      <div class="nav-item" data-section="releases">🏷 <span>Releases</span></div>
      <div class="nav-item" data-section="tags"># <span>Tags</span></div>
      <div class="nav-item" data-section="repos">📚 <span>Repos</span></div>
      <div class="nav-item" data-section="orgs">🏢 <span>Orgs</span></div>
      <div class="nav-item" data-section="modules">🔐 <span>Modules</span></div>
      <div class="nav-item" data-section="templates">🧩 <span>Templates</span></div>
      <div class="nav-item" data-section="pages">🌐 <span>Pages</span></div>
      <div class="nav-item" data-section="repo">🗃 <span>Repo</span></div>
    </nav>

    <main id="content">
      <div class="empty"><div class="empty-icon">◌</div><div class="empty-text">Booting control center…</div></div>
    </main>

    <aside id="drawer" class="hidden">
      <div class="drawer-head">
        <div class="drawer-title" id="drawer-title">Run</div>
        <button id="drawer-close" class="btn ghost">✕</button>
      </div>
      <div class="drawer-body" id="drawer-body"></div>
    </aside>
  </div>

  <footer id="statusbar">
    <span id="status-left">starting…</span>
    <span class="spacer"></span>
    <span id="status-right"></span>
  </footer>

  <div id="toasts"></div>

  <script src="app.js"></script>
</body>
</html>
