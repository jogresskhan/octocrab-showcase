name: Suite CI

on:
  workflow_dispatch:
    inputs:
      note:
        description: "Dispatch note"
        required: false
        default: "hello from octocrab-cli"

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Say hello
        run: echo "octocrab suite dispatch: ${{ github.event.inputs.note }}"
      - name: Probe system
        run: uname -a && date -u
      - name: Final check
        run: echo "all steps observed by octocrab-cli workflows watch"
