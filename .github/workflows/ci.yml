name: CI (octocrab-showcase)

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# Rapid pushes stack runs; cancel the superseded ones so queued macOS
# runners (a scarce, occasionally flaky pool) go to the newest commit.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: check+test (${{ matrix.os }})
    # Hosted runners sometimes boot but never pick the job up (observed on
    # macOS: started, zero steps, hangs until manually cancelled). A job
    # timeout turns that into a legible, retryable failure instead.
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
      - name: Check workspace
        run: cargo check --workspace --all-targets --exclude octocrab-tauri
      - name: Test workspace
        run: cargo test --workspace --exclude octocrab-tauri

  lint:
    timeout-minutes: 15
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
      - name: Format
        run: cargo fmt --all -- --check
      - name: Clippy
        run: cargo clippy --workspace --exclude octocrab-tauri -- -D warnings
