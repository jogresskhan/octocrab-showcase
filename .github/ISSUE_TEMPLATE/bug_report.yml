name: Bug report
description: Something in octocrab-showcase is broken or surprising
labels: [bug]
body:
  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: Also tell us what you expected to happen.
    validations:
      required: true
  - type: textarea
    id: repro
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. run `...`
        2. see error
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Version / platform
      placeholder: e.g. v0.1.0 on ubuntu 24.04
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Logs or screenshots